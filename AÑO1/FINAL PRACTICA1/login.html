<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Practica</title>
    <link rel="stylesheet" href="styles.css"
    
</head>



<body>

  <header class="barra-superior">
    <div>   
        <h1>Bienvenido</h1> 
    </div>  

    <div class="nav-container">
        <a href="home.html" class="boton">Inicio</a>
        <a id="loginBtn" class="boton" href="login.html">Login</a>
    </div>

  </header>
  
<main>
    <div class="login-container">
        <h2>Iniciar Sesión</h2>

        <form id="form-login">
            <input class="input-login" id="email" type="email" placeholder="Email" required>
            <input class="input-login" id="password" type="password" placeholder="Contraseña" required>
            <button type="submit" class="btn-login">Entrar</button>

        </form>

        <p id="mensaje"></p>

    </div>


</main>

    <footer>
        <div class="barra-inferior">
            <div class="titulo-footer-container">
                <h2> IDW S.A.</h2>
            <div class="separador-vert"></div>
                

                <div class="texto-footer"> 
                    <h1>"Final"</h1>
                </div>
                
            </div>
        
        </div>
    </footer>  
  
    <script src="login.js"></script>
    
</body>


</html>
