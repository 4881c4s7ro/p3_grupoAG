<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="../css/estilos-base.css">
    
    <link rel="stylesheet" href="../css/home.css">
    <title>Catálogo de Profesionales</title>
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-height">
            <div class="container">
                <span class="navbar-text me-2 d-none" id="userInfo">Bienvenido, <span class="user-info">Usuario</span></span>
                
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                
                <div class="collapse navbar-collapse" id="navbarNav">
                    <div class="botonera-navegacion ms-auto">
                        <a href="home.html" class="boton-nav nav-link">Inicio</a>
                        <a href="contacto.html" class="boton-nav nav-link">Contacto</a>
                        <a href="profesionales.html" class="boton-nav nav-link active">Catálogo de profesionales</a>
                        <a href="admin-medicos.html" class="boton-nav nav-link" id="adminLink">Administración</a>
                        <a href="login.html" class="boton-nav nav-link" id="loginLink">Iniciar Sesión</a>
                        <button class="btn btn-outline-light btn-sm logout-btn d-none" id="logoutBtn">Cerrar sesión</button>
                    </div>
                </div>
            </div>
        </nav>
    </header>
    <main>
        <div class="container my-5">
            <h1>Catálogo de Profesionales</h1>
            <p>Especialistas disponibles en la cartilla</p>
            
            <div class="profesionales">
                <div class="cards-medicos">
                    <div class="row" id="contenedorMedicos">
                    </div>
                </div>
            </div>

            <div id="contenedorModales">
            </div>
        </div>
    </main>
    <footer>
        <div class="barra-inferior">
            <div class="titulo-footer-container">
                <h2> IDW S.A.</h2>
            </div>
            <div class="separador-vert"></div>
            <div class="info-footer-container">
                <h5 class="info-item"><img src="../assets/images/icons8-location-100.png" width="20px" alt="icono-ubicacion"> Buenos Aires 255, Concordia, Entre Ríos </h5>
                <h5 class="info-item"><img src="../assets/images/icons8-phone-100.png" width="20px" alt="icono-telefono"> 0800-555-5555 </h5>
            </div>
        </div>
    </footer>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/auth-guard.js"></script>
    <script>
        // Lógica específica para profesionales
        document.addEventListener('DOMContentLoaded', () => {
            const loginLink = document.getElementById('loginLink');
            const userInfo = document.getElementById('userInfo');
            const logoutBtn = document.getElementById('logoutBtn');
            const adminLink = document.getElementById('adminLink');

            function updateProfesionalesUI() {
                if (window.AuthGuard && window.AuthGuard.isAuthenticated()) {
                    // Usuario logueado
                    loginLink.style.display = 'none';
                    userInfo.classList.remove('d-none');
                    logoutBtn.classList.remove('d-none');
                    
                    // Actualizar nombre del usuario
                    const user = window.AuthGuard.getStoredUser();
                    const userName = user ? `${user.firstName || ''} ${user.lastName || ''}`.trim() : 'Usuario';
                    const userNameSpan = document.querySelector('.user-info');
                    if (userNameSpan) {
                        userNameSpan.textContent = userName;
                    }
                } else {
                    // Usuario no logueado
                    loginLink.style.display = 'block';
                    userInfo.classList.add('d-none');
                    logoutBtn.classList.add('d-none');
                }
            }

            // Actualizar UI inicial
            updateProfesionalesUI();

            // Proteger acceso a administración
            if (adminLink) {
                adminLink.addEventListener('click', (e) => {
                    if (!window.AuthGuard || !window.AuthGuard.isAuthenticated()) {
                        e.preventDefault();
                        alert('Debe iniciar sesión para acceder al panel de administración.');
                        window.location.href = 'login.html';
                    }
                });
            }
        });
    </script>
    <script type="module" src="../js/profesionales.js"></script>
</body>
</html>
