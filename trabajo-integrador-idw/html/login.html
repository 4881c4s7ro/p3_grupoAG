<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Panel de Administración - Trabajo Final</title>
  <style>
    body{font-family:Segoe UI,Arial,Helvetica,sans-serif;margin:20px}
    .hidden{display:none}
    .container{max-width:900px;margin:0 auto}
    header{display:flex;justify-content:space-between;align-items:center}
    header h1{font-size:1.1rem}
    .card{border:1px solid #ddd;padding:16px;border-radius:6px;margin-top:12px}
    table{width:100%;border-collapse:collapse}
    th,td{padding:8px;border-bottom:1px solid #eee;text-align:left}
    button{margin-right:6px}
    form > *{display:block;margin:8px 0}
    .actions{margin-top:12px}
    .topbar{display:flex;gap:12px}
    .warning{color:#a00}
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Panel de Administración - Trabajo Final</h1>
      <div class="topbar">
        <div id="userBadge" class="hidden"></div>
        <button id="logoutBtn" class="hidden">Cerrar sesión</button>
      </div>
    </header>

    <section id="loginSection" class="card">
      <h2>Inicio de sesión</h2>
      <form id="loginForm">
        <label>Usuario <input type="text" name="username" required /></label>
        <label>Contraseña <input type="password" name="password" required /></label>
        <div class="actions">
          <button type="submit">Iniciar sesión</button>
        </div>
      </form>
      <p>Usuarios válidos: ver <a href="https://dummyjson.com/users" target="_blank">https://dummyjson.com/users</a></p>
    </section>

    <nav id="adminNav" class="hidden">
      <button data-section="users">Usuarios</button>
    </nav>

    <section id="usersSection" class="card hidden">
      <h2>Usuarios registrados</h2>
      <p class="warning">No se muestran datos sensibles (contraseñas, bank, etc.).</p>
      <div style="margin:8px 0">
        <button id="refreshUsers">Refrescar</button>
        <button id="showCreateUser">Crear usuario</button>
      </div>
      <div id="createUserForm" class="hidden card">
        <h3>Crear usuario</h3>
        <form id="formCreateUser">
          <input name="firstName" placeholder="Nombre" required />
          <input name="lastName" placeholder="Apellido" required />
          <input name="username" placeholder="username" required />
          <input name="email" placeholder="email" type="email" required />
          <input name="phone" placeholder="phone" />
          <div class="actions"><button type="submit">Crear</button> <button id="cancelCreate" type="button">Cancelar</button></div>
        </form>
      </div>
      <div id="usersList"></div>
    </section>

    <footer style="margin-top:20px;color:#666">Aplicación demo usando API pública <a href="https://dummyjson.com" target="_blank">dummyjson.com</a></footer>
  </div>

  <script src="../js/trabajo.js"></script>
</body>
</html>
